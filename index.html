<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #fff;
}
.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
    position: relative;
    z-index: 2;
}
.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 25px;
    padding: 30px 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
h1 {
    font-size: 32px;
    margin-bottom: 15px;
}
.message {
    font-size: 19px;
    line-height: 1.6;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.photo {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
    border-radius: 18px;
    margin: 15px 0;
    display: none;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}
button {
    border: none;
    padding: 14px 28px;
    border-radius: 50px;
    background: #fff;
    color: #e75480;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    transform: scale(1.08);
}
.heart {
    position: absolute;
    bottom: -50px;
    animation: float 6s linear infinite;
    opacity: 0.7;
}
@keyframes float {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    20% {
        opacity: 0.8;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
.fade {
    animation: fade 0.5s ease;
}
@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🎂 Happy Birthday ❤️</h1>
        <div id="content">
            <div class="message" id="message">
                Today is not just another day...  
                It's the day someone very special was born. ❤️
            </div>
        </div>
        <button onclick="nextMessage()" id="nextBtn">
            Tap to continue ❤️
        </button>
    </div>
</div>
<script>
const messages = [
    {
        text: "Today is not just another day... It's the day someone very special was born. ❤️",
        photo: null
    },
    {
        text: "Happy Birthday to one of the most amazing people I've had the luck to know. 🥹❤️",
        photo: "IMG_3465.jpeg"
    },
    {
        text: "We've shared so many memories, laughs, random talks and countless moments... and I hope there are many more to come. ✨",
        photo: null
    },
    {
        text: "No matter how much time passes, some people always remain special. And you're definitely one of them. ❤️",
        photo: "IMG_6194.jpeg"
    },
    {
        text: "I hope this new year of your life brings you happiness, peace, success and everything your heart wishes for. 🌸",
        photo: null
    },
    {
        text: "And most importantly... never stop being the person you are. You're pretty amazing just the way you are. 🫶",
        photo: "IMG_7085.jpeg"
    },
    {
        text: "Once again... HAPPY BIRTHDAY! 🎂🎉❤️",
        photo: null
    },
    {
        text: "May your smile always stay this beautiful. ❤️✨",
        photo: null
    }
];
let current = 0;
function nextMessage() {
    current++;
    if (current >= messages.length) {
        document.getElementById("message").innerHTML =
            "❤️ The End ❤️<br><br>But the memories continue...";
        document.getElementById("nextBtn").style.display = "none";
        return;
    }
    const message = document.getElementById("message");
    message.classList.remove("fade");
    void message.offsetWidth;
    message.classList.add("fade");
    message.innerHTML = messages[current].text;
    const oldPhoto = document.querySelector(".photo");
    if (oldPhoto) {
        oldPhoto.remove();
    }
    if (messages[current].photo) {
        const img = document.createElement("img");
        img.src = messages[current].photo;
        img.className = "photo";
        img.style.display = "block";
        document.getElementById("content").appendChild(img);
    }
}
/* Floating hearts */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";
    heart.style.animationDuration =
        (4 + Math.random() * 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => {
        heart.remove();
    }, 8000);
}
setInterval(createHeart, 600);
</script>
</body>
</html>
